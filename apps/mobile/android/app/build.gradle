apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: map each build variant to its .env.<flavor> file (§M4 env flavors).
//
// BUILD ONE FLAVOR PER GRADLE INVOCATION. `dotenv.gradle`'s `getCurrentFlavor()` scans
// `gradle.startParameter.taskNames` and stops at the FIRST match, then applies that single env
// file to `defaultConfig` — i.e. to EVERY variant in the build. So
//     ./gradlew assembleDevRelease assembleProdRelease
// bakes .env.dev into BOTH APKs (the prod APK then silently points at the dev backend).
// Correct:
//     ENVFILE=.env.dev  ./gradlew assembleDevRelease
//     ENVFILE=.env.prod ./gradlew assembleProdRelease
// The explicit ENVFILE takes priority over this map, so it is the safe way to be certain.
// Verify after building:  grep API_BASE_URL app/build/generated/source/buildConfig/<flavor>/release/com/velchat/BuildConfig.java
project.ext.envConfigFiles = [
    devdebug             : ".env.dev",
    devdebugoptimized    : ".env.dev",
    devrelease           : ".env.dev",
    stagedebug           : ".env.stage",
    stagedebugoptimized  : ".env.stage",
    stagerelease         : ".env.stage",
    proddebug            : ".env.prod",
    proddebugoptimized   : ".env.prod",
    prodrelease          : ".env.prod",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// ── Firebase Cloud Messaging (ADR 0008) ──────────────────────────────────────
//
// The google-services plugin FAILS the build when the flavor being built has no
// `google-services.json`. That is unacceptable here for two reasons: a fresh clone has no
// Firebase project at all, and `dev`/`stage` use different application ids
// (com.velchat.dev / com.velchat.stage) which need their OWN Firebase Android clients — until
// someone adds them, those flavors must keep building.
//
// So the plugin is applied only when a config for THIS build actually resolves. When it does
// not, `FirebaseApp.getApps()` is empty at runtime, `VelChatPushModule.isSupported()` returns
// false, JS reports `unsupported`, and the SyncEngine keeps its background socket — the
// pre-push behaviour, un-crashed. See `docs/push-setup.md`.
//
// One flavor per Gradle invocation, same as the ENVFILE rule documented above: the flavor is
// read from the task names, so `assembleDevRelease assembleProdRelease` in one call would
// resolve a single config for both. Build them separately.
def velchatBuildFlavor = {
    def names = (gradle.startParameter.taskNames ?: []).join(" ").toLowerCase()
    // Longest first so "stage" is not shadowed by a substring match elsewhere.
    for (candidate in ["stage", "prod", "dev"]) {
        if (names.contains(candidate)) return candidate
    }
    return null
}()

def velchatFirebaseConfig = {
    def candidates = []
    if (velchatBuildFlavor != null) {
        candidates << file("src/${velchatBuildFlavor}/google-services.json")
    }
    // The app-level file applies to every flavor, so it is the only safe fallback when no
    // flavor could be determined (a bare `./gradlew build`, or an IDE sync).
    candidates << file("google-services.json")
    return candidates.find { it.exists() }
}()

if (velchatFirebaseConfig != null) {
    logger.lifecycle("VelChat push: using ${velchatFirebaseConfig}")
} else {
    logger.lifecycle(
        "VelChat push: no google-services.json for flavor '${velchatBuildFlavor ?: "(none)"}' — " +
        "building without FCM; push will report unsupported at runtime.")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    hermesCommand = file("$rootDir/../../../node_modules/.pnpm/hermes-compiler@250829098.0.14/node_modules/hermes-compiler/hermesc/win64-bin/hermesc.exe").exists()
        ? "$rootDir/../../../node_modules/.pnpm/hermes-compiler@250829098.0.14/node_modules/hermes-compiler/hermesc/win64-bin/hermesc.exe"
        : "hermesc"

    /* Autolinking */
    autolinkLibrariesWithApp()

    // Flavors added below (dev/stage/prod). Debug variants use the Metro dev
    // server and skip JS bundling; release variants bundle JS into the APK.
    debuggableVariants = [
        "devDebug", "devDebugOptimized",
        "stageDebug", "stageDebugOptimized",
        "prodDebug", "prodDebugOptimized",
    ]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.velchat"
    defaultConfig {
        applicationId "com.velchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // react-native-config resolves BuildConfig by REFLECTION, and it looks the class up under
        // the runtime APPLICATION ID:
        //     Class.forName(context.getPackageName() + ".BuildConfig")
        // The dev/stage flavors add an applicationIdSuffix, so their application ids are
        // `com.velchat.dev` / `com.velchat.stage` while BuildConfig is always generated in the
        // NAMESPACE, `com.velchat`. The lookup therefore threw ClassNotFoundException, the module
        // returned an EMPTY config, and `core/config/env.ts` silently fell back to its production
        // URLs — so every dev/stage build talked to the prod host (and prod only ever "worked"
        // because its application id happens to equal the namespace).
        // This resource is the hook the library checks first; point it at the real namespace.
        resValue "string", "build_config_package", "com.velchat"
    }
    // §M1/§F1: distinct bundle IDs per env so all three install side by side.
    // dev -> com.velchat.dev, stage -> com.velchat.stage, prod -> com.velchat
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        stage {
            dimension "env"
            applicationIdSuffix ".stage"
            versionNameSuffix "-stage"
        }
        prod {
            dimension "env"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // The ONE dependency ADR 0008 accepts: FCM itself. Unconditional, so the push module always
    // COMPILES; whether it can do anything is decided at runtime by the presence of a Firebase
    // config (see `velchatFirebaseConfig` above). Notification building uses `androidx.core`,
    // which arrives transitively as an `api` dependency of react-android's appcompat.
    implementation("com.google.firebase:firebase-messaging:24.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Applied LAST, and only when a config resolved — see the block near the top of this file.
if (velchatFirebaseConfig != null) {
    apply plugin: "com.google.gms.google-services"
}
